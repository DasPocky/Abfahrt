name: push-setup

# Einmalige Einrichtung für Web Push (#71), manuell starten:
# - legt die D1-Datenbank „abfahrt-push“ an (falls noch nicht vorhanden) und nennt ihre ID
# - erzeugt das VAPID-Schlüsselpaar hier im Runner und speichert den privaten Schlüssel direkt
#   als Worker-Secret VAPID_PRIVATE_JWK; ausgegeben wird nur der öffentliche Schlüssel.
#   Ein vorhandenes Secret bleibt unangetastet (sonst wären alle Push-Abos ungültig),
#   außer „rotate_vapid“ ist gesetzt.
on:
  workflow_dispatch:
    inputs:
      rotate_vapid:
        description: "VAPID-Schlüssel neu erzeugen (macht alle Push-Abos ungültig)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: push-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: D1-Datenbank anlegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! npx wrangler d1 list --json | jq -e '.[] | select(.name == "abfahrt-push")' >/dev/null; then
            npx wrangler d1 create abfahrt-push --location weur
          fi
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "abfahrt-push") | .uuid')
          echo "D1 abfahrt-push: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: VAPID-Schlüssel als Worker-Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROTATE: ${{ inputs.rotate_vapid }}
        run: |
          if npx wrangler secret list --format json | jq -e '.[] | select(.name == "VAPID_PRIVATE_JWK")' >/dev/null \
            && [ "$ROTATE" != "true" ]; then
            echo "VAPID_PRIVATE_JWK existiert bereits, unverändert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key_file="$RUNNER_TEMP/vapid.json"
          public_key=$(node scripts/vapid-keys.mjs "$key_file")
          npx wrangler secret put VAPID_PRIVATE_JWK < "$key_file"
          rm -f "$key_file"
          echo "Öffentlicher VAPID-Schlüssel: \`$public_key\`" >> "$GITHUB_STEP_SUMMARY"
